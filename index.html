<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digital Timer with Particles</title>

<script src="https://cdn.jsdelivr.net/npm/brython@3/brython.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/brython@3/brython_stdlib.js"></script>

<style>
    html, body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        height: 100%;
        font-family: Arial, Helvetica, sans-serif;
        background: #121212;
        color: white;
    }

    canvas {
        position: absolute;
        top: 0;
        left: 0;
        z-index: 0;
    }

    #content {
        position: absolute;
        z-index: 1;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
    }

    h1 {
        font-size: 50px;
        margin-bottom: 20px;
        color: #00ff8c;
        text-shadow: 0 0 10px #00ff73;
        letter-spacing: 2px;
    }

    #Timer {
        font-size: 80px;
        font-weight: bold;
        padding: 20px 40px;
        border-radius: 15px;
        background: rgba(28,28,28,0.6);
        box-shadow: 0 0 20px rgba(0,255,55,0.5);
        text-shadow: 0 0 20px #00ff40;
        letter-spacing: 5px;
    }
</style>
</head>
<body onload="brython()">

<canvas id="particleCanvas"></canvas>

<div id="content">
    <h1>Digital Timer</h1>
    <p id="Timer">00:00:00</p>
</div>

<!-- Brython Timer -->
<script type="text/python">
from browser import document, timer
from datetime import datetime as dt

t = document['Timer']

def update_timer():
    now = dt.now()
    current_time = now.strftime("%H:%M:%S")
    t.text = current_time

timer.set_interval(update_timer, 1000)
</script>

<!-- JS Particle Background -->
<script>
const canvas = document.getElementById('particleCanvas');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const particlesArray = [];
const colors = ['#00ff8c','#00ffd8','#00ff40','#0affff','#00aaff'];

class Particle {
    constructor(x, y, size, color, velocity){
        this.x = x;
        this.y = y;
        this.size = size;
        this.color = color;
        this.velocity = velocity;
    }
    update() {
        this.x += this.velocity.x;
        this.y += this.velocity.y;

        // bounce on edges
        if(this.x <=0 || this.x >= canvas.width) this.velocity.x *= -1;
        if(this.y <=0 || this.y >= canvas.height) this.velocity.y *= -1;
    }
    draw() {
        ctx.beginPath();
        ctx.arc(this.x,this.y,this.size,0,Math.PI*2);
        ctx.fillStyle = this.color;
        ctx.fill();
    }
}

// create particles
function initParticles(num){
    particlesArray.length = 0;
    for(let i=0;i<num;i++){
        let size = Math.random()*3+1;
        let x = Math.random()*canvas.width;
        let y = Math.random()*canvas.height;
        let color = colors[Math.floor(Math.random()*colors.length)];
        let velocity = {x:(Math.random()-0.5)*1.5, y:(Math.random()-0.5)*1.5};
        particlesArray.push(new Particle(x,y,size,color,velocity));
    }
}
initParticles(150);

// connect particles with lines
function connectParticles(){
    for(let a=0;a<particlesArray.length;a++){
        for(let b=a;b<particlesArray.length;b++){
            let dx = particlesArray[a].x - particlesArray[b].x;
            let dy = particlesArray[a].y - particlesArray[b].y;
            let distance = Math.sqrt(dx*dx + dy*dy);
            if(distance < 120){
                ctx.strokeStyle = 'rgba(0,255,140,'+(1-distance/120)+')';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(particlesArray[a].x, particlesArray[a].y);
                ctx.lineTo(particlesArray[b].x, particlesArray[b].y);
                ctx.stroke();
            }
        }
    }
}

// animate
function animate(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    particlesArray.forEach(p=>{p.update(); p.draw();});
    connectParticles();
    requestAnimationFrame(animate);
}
animate();

// resize canvas
window.addEventListener('resize',()=>{
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    initParticles(150);
});
</script>

</body>
</html>
